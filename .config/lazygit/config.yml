# Lazygit Configuration - Catppuccin Mocha
# ==========================================

gui:
  nerdFontsVersion: "3"
  showBottomLine: false
  showPanelJumps: false
  theme:
    activeBorderColor:
      - "#cba6f7"  # mauve
      - bold
    inactiveBorderColor:
      - "#a6adc8"  # subtext0
    optionsTextColor:
      - "#89b4fa"  # blue
    selectedLineBgColor:
      - "#313244"  # surface0
    cherryPickedCommitBgColor:
      - "#45475a"  # surface1
    cherryPickedCommitFgColor:
      - "#cba6f7"  # mauve
    unstagedChangesColor:
      - "#f38ba8"  # red
    defaultFgColor:
      - "#cdd6f4"  # text
    searchingActiveBorderColor:
      - "#f9e2af"  # yellow

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never

os:
  editPreset: "nvim"

keybinding:
  universal:
    quit: "q"
    quit-alt1: "<c-c>"
